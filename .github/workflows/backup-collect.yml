name: Macro ICE backup collection
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Run a collection even if the main collector looks healthy (test only)'
        required: false
        default: 'false'
concurrency:
  group: macro-ice-backup
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MACRO_ICE_BASE: ${{ vars.MACRO_ICE_BASE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Does the main collector need help?
        id: guard
        env:
          FORCE: ${{ github.event.inputs.force }}
        run: node backup-guard.mjs
      - name: Collect and import
        if: steps.guard.outputs.run == 'true'
        env:
          MACRO_ICE_SERVICE_TOKEN: ${{ secrets.MACRO_ICE_SERVICE_TOKEN }}
        run: printf '%s\n' "$MACRO_ICE_SERVICE_TOKEN" | node backup-refresh.mjs full
