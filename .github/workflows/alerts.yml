name: Macro ICE cloud alerts
on:
  schedule:
    - cron: '*/20 0-22 * * 1-5'
    - cron: '*/20 21-23 * * 0'
  workflow_dispatch:
concurrency:
  group: macro-ice-alerts
  cancel-in-progress: false
jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore last state
        uses: actions/cache/restore@v4
        with:
          path: alerts/run
          key: alerts-state-never-matches
          restore-keys: alerts-state-
      - name: Run alerts
        env:
          ALERTS_CLOUD: '1'
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          mkdir -p alerts/run
          for f in alerts.mjs calibration.mjs positions-lib.mjs; do
            src=$(find . -path ./alerts/run -prune -o -name "$f" -type f -print | head -n 1)
            if [ -n "$src" ]; then cp "$src" alerts/run/; else echo "missing $f"; fi
          done
          ls alerts/run
          [ -f alerts/run/alerts.mjs ] || { echo "alerts.mjs was not uploaded to the repo"; exit 1; }
          printf '%s\n' "$NTFY_TOPIC" > alerts/run/ntfy-topic.txt
          echo "cloud copy" > alerts/run/alerts-no-popup.txt
          echo "cloud copy" > alerts/run/alerts-no-calibration.txt
          cd alerts/run && node alerts.mjs
      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            alerts/run/alerts-state.json
            alerts/run/logs
          key: alerts-state-${{ github.run_id }}
